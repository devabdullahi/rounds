name: Rounds
options:
  bundleIdPrefix: com.abdul
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Rounds:
    type: application
    platform: iOS
    sources: [Rounds]
    info:
      path: Rounds/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdul.rounds
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Rounds
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Rounds listens so you can talk to the patient out loud."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Rounds turns what you say into questions for the patient."
        TARGETED_DEVICE_FAMILY: "1"
