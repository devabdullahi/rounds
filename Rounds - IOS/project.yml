name: Rounds
options:
  bundleIdPrefix: com.abdul
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  # Native Google Sign-In sheet (approved dependency); Supabase verifies the ID token it returns.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  # Remote paywalls (approved dependency); purchases go through StoreKit 2.
  SuperwallKit:
    url: https://github.com/superwall/Superwall-iOS
    from: 4.16.0
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  Rounds:
    type: application
    platform: iOS
    sources: [Rounds]
    dependencies:
      - package: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: SuperwallKit
    scheme:
      testTargets: [RoundsTests]
      # Local StoreKit testing: the subscriptions in Config/Rounds.storekit, no App Store Connect needed.
      storeKitConfiguration: Config/Rounds.storekit
    info:
      path: Rounds/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Only standard HTTPS: skips App Store Connect's export-compliance question on every build.
        ITSAppUsesNonExemptEncryption: false
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        SuperwallAPIKey: $(SUPERWALL_API_KEY)
        # Google Sign-In returns to the reversed client ID; "rounds" receives email confirmation links.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
          - CFBundleURLSchemes: [rounds]
        # Lets the simulator reach the local Supabase over http://127.0.0.1; doesn't relax anything else.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdul.rounds
        # The paid Apple Developer Program team (Individual).
        DEVELOPMENT_TEAM: 5FVTJZXNS5
        # Sign in with Apple (Rounds.entitlements), on by default in Base.xcconfig; a free Personal
        # Team build clears ROUNDS_ENTITLEMENTS in Secrets.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(ROUNDS_ENTITLEMENTS)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Rounds
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Rounds listens so you can talk to the patient out loud."
        INFOPLIST_KEY_NSCameraUsageDescription: "Rounds uses the camera to scan your notes into flashcards."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Rounds turns what you say into questions for the patient."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Rounds connects to the development server on your Mac."
        TARGETED_DEVICE_FAMILY: "1"
  RoundsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RoundsTests]
    dependencies:
      - target: Rounds
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.abdul.rounds.tests
