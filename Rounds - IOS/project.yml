name: Rounds
options:
  bundleIdPrefix: com.abdul
  deploymentTarget:
    iOS: "17.0"
# Files shown in the project but built into no target. Xcode only offers (and finds) a StoreKit
# configuration that's in the project, so the scheme's storeKitConfiguration needs it here.
fileGroups:
  - Config/Rounds.storekit
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  # Native Google Sign-In sheet (approved dependency); Supabase verifies the ID token it returns.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  # Remote paywalls (approved dependency); purchases go through StoreKit 2.
  SuperwallKit:
    url: https://github.com/superwall/Superwall-iOS
    from: 4.16.0
  # Live voice with the patient over OpenAI's Realtime API (approved dependency, 2026-10-18):
  # prebuilt Google WebRTC. Pinned, never tracking main.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 154.0.0
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "25"
targets:
  Rounds:
    type: application
    platform: iOS
    sources: [Rounds]
    dependencies:
      - package: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: SuperwallKit
      - package: WebRTC
    scheme:
      testTargets: [RoundsTests]
      # Local StoreKit testing: the subscriptions in Config/Rounds.storekit, no App Store Connect needed.
      storeKitConfiguration: Config/Rounds.storekit
    info:
      path: Rounds/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Only standard HTTPS: skips App Store Connect's export-compliance question on every build.
        ITSAppUsesNonExemptEncryption: false
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        SuperwallAPIKey: $(SUPERWALL_API_KEY)
        # Google Sign-In returns to the reversed client ID; "rounds" receives email confirmation links.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
          - CFBundleURLSchemes: [rounds]
    # Debug builds only: lets the simulator reach a local Supabase over http://127.0.0.1 (relaxes
    # nothing else). Release ships without it. A dictionary key has no INFOPLIST_KEY_ setting, so it's
    # added to the built Info.plist before signing.
    postBuildScripts:
      - name: Debug-only local networking
        basedOnDependencyAnalysis: false
        script: |
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdul.rounds
        # The paid Apple Developer Program team (Individual).
        DEVELOPMENT_TEAM: 5FVTJZXNS5
        # Sign in with Apple (Rounds.entitlements), on by default in Base.xcconfig; a free Personal
        # Team build clears ROUNDS_ENTITLEMENTS in Secrets.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(ROUNDS_ENTITLEMENTS)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Rounds
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Rounds listens so you can talk to the patient out loud."
        INFOPLIST_KEY_NSCameraUsageDescription: "Rounds uses the camera to scan your notes into flashcards."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Rounds turns what you say into questions for the patient."
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # The local development server prompt is for Debug builds only.
        Debug:
          INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Rounds connects to the development server on your Mac."
  RoundsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RoundsTests]
    dependencies:
      - target: Rounds
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.abdul.rounds.tests
