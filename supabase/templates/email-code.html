<!-- Rounds sign-in code. Used for both new accounts (confirmation) and log in (magic link):
     the app asks for the 6-digit code; Rounds has no passwords. -->
<div style="font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; max-width: 440px; margin: 0 auto; padding: 32px 24px; color: #161929">
  <p style="margin: 0; font-size: 15px; font-weight: 600; color: #028B4F">Rounds</p>
  <h1 style="margin: 16px 0 8px; font-size: 24px">Your sign-in code</h1>
  <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.5; color: #434755">Enter this code in the app. It works for 10 minutes.</p>
  <p style="margin: 0 0 24px; padding: 18px 0; border-radius: 14px; background: #F5F6FB; text-align: center; font-size: 34px; font-weight: 700; letter-spacing: 10px">{{ .Token }}</p>
  <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #6C6F7C">Didn't ask for this? You can ignore this email; nobody can sign in without the code.</p>
</div>
